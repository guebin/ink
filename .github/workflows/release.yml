# Releasing Ink was four manual steps — build the dmg, cut a release, upload
# the asset, and hand-edit the cask — and skipping any of them left the
# download behind the code. Pushing a v* tag now does all four.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release, and commit the cask back to main

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # main has to be here too, to land the cask on it

      - name: Build the dmg
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Ink.dmg \
            --title "Ink ${GITHUB_REF_NAME#v}" --generate-notes

      # A cask whose sha256 belongs to an older dmg fails on checksum, so this
      # is the step that must not be forgotten. It is the one most easily
      # forgotten, which is the whole argument for doing it here.
      - name: Point the cask at what was just built
        run: |
          V="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 dist/Ink.dmg | cut -d' ' -f1)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          sed -i '' -e "s/^  version \".*\"/  version \"$V\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/ink.rb
          git add Casks/ink.rb
          if git diff --cached --quiet; then
            echo "cask already matches $V"
          else
            git commit -m "Point the cask at $GITHUB_REF_NAME"
            git push origin main
          fi
